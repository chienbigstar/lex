<html>

<body>
    <div class="container">
        <div class="panel panel-primary">
            <div class="panel-heading">Frame</div>

                <select id="bucket" class="form-select">

                    <option value="row">raw</option>

                    <option value="1d2d">1d2d</option>
                </select>
                <button id="go" class="btn btn-info">Go</button>
            </div>
        </div>
        <div class="panel panel-primary">
            <div class="panel-heading">List</div>
            <div class="panel-body" id="result"></div>
        </div>
        <div class="panel panel-primary">

            </div>
        </div>
    </div>
    <script>
        function addEMA400(data, index) {
            var K = 2 / (400 + 1)
            var item = data[index];
            if (data[index - 1].ema)
                var prevEma = data[index - 1].ema;
            else {
                var sum = 0;
                var list400 = []
                for (var y = 0; y < 400; y++) {
                    var i2 = data[index - y];
                    list400.push(i2[4])
                    sum += parseFloat(i2[4]);
                }
                var prevEma = Math.round(sum / 400 * 10000000) / 10000000;
            }
            data[index]['ema400'] = (prevEma * K) + (prevEma * (1 - K));
        }
        $(document).ready(function () {
            $('#go').click(async function () {
            try {
                var bucket = $('#bucket').val()
                var res = await $.get(`https://api.binance.com/api/v1/exchangeInfo`)
                var symbols = res.symbols.filter(s => s.quoteAsset == 'USDT')
                $('#result').text('')
                for (var s of symbols) {
                    var datas = await $.get(`https://www.binance.com/api/v3/uiKlines?limit=900&symbol=${s.symbol}&interval=1d`)
                    if(datas.length > 800) continue

                    var datas = await $.get(`https://www.binance.com/api/v3/uiKlines?limit=500&symbol=${s.symbol}&interval=1d`)
                    if(datas.length > 400)  {
                        addEMA400(datas, datas.length - 1)
                        var lastItem = datas[datas.length - 1]
                        if(Math.abs(lastItem[4] - lastItem['ema400']) < (lastItem['ema400'] * 10 / 100))
                            $('#result').text($('#result').text() + `${s.symbol}, `)
                        continue
                    }


                    var datas = await $.get(`https://www.binance.com/api/v3/uiKlines?limit=500&symbol=${s.symbol}&interval=12h`)
