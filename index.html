<html>

<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>
    <div class="container">
        <div class="panel panel-primary">
            <div class="panel-heading">Frame</div>
            <div class="panel-body">
                <select id="bucket" class="form-select">
                    <option value="change">change</option>
                    <option value="row">raw</option>
                    <option value="1d">1d</option>
                    <option value="1d2d">1d2d</option>
                </select>
                <button id="go" class="btn btn-info">Go</button>
            </div>
        </div>
        <div class="panel panel-primary">
            <div class="panel-heading">List</div>
            <div class="panel-body" id="result"></div>
        </div>
    </div>
    <script>
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        function addEMA400(data, index) {
            var K = 2 / (400 + 1)
            var item = data[index];
            if (data[index - 1].ema)
                var prevEma = data[index - 1].ema;
            else {
                var sum = 0;
                var list400 = []
                for (var y = 0; y < 400; y++) {
                    var i2 = data[index - y];
                    list400.push(i2[4])
                    sum += parseFloat(i2[4]);
                }
                var prevEma = Math.round(sum / 400 * 10000000) / 10000000;
            }
            data[index]['ema400'] = (prevEma * K) + (prevEma * (1 - K));
        }
        $(document).ready(function () {
            $('#go').click(async function () {
                try {
                    var bucket = $('#bucket').val()
                    var res = await $.get(`https://api.binance.com/api/v1/exchangeInfo`)
                    var symbols = res.symbols.filter(s => s.quoteAsset == 'USDT' && s.status == "TRADING").reverse()
                    $('#result').text('')
                    for (var s of symbols) {
                        try {
                            // if (s.symbol == 'ROBOUSDT') continue
                            var datas = await $.get(`https://www.binance.com/api/v3/uiKlines?limit=900&symbol=${s.symbol}&interval=1d`)
                            if (datas.length > 420 || datas.length < 100) continue;
                            if (datas.length > 205) {
                                datas = await $.get(`https://www.binance.com/api/v3/uiKlines?limit=10000&symbol=${s.symbol}&interval=12h`)
                                for (let i = datas.length - 1; i >= 200; i--) {
                                    addEMA400(datas, i)
                                    if (datas[i].ema400 > 0 && (datas[i].ema400 < parseFloat(datas[i][4]))) {
                                        var priceOpen = parseFloat(datas[i][1])
                                        for (let x = i - 1; x >= 0; x--) {
                                            if (parseFloat(datas[x][1]) <= priceOpen) priceOpen = parseFloat(datas[x][1])
                                            else break;
                                        }
                                        let pass = true
                                        for (let x = i + 1; x < datas.length - 1; x++) {
                                            if (parseFloat(datas[x][4]) < priceOpen) {
                                                pass = false
                                                break
                                            }
                                        }
                                        if (pass) $('#result').text($('#result').text() + `${s.symbol}, `)
                                        break
                                    }
                                }
                            }
                            if (datas.length > 105) {
                                datas = await $.get(`https://www.binance.com/api/v3/uiKlines?limit=10000&symbol=${s.symbol}&interval=6h`)
                                for (let i = datas.length - 1; i >= 200; i--) {
                                    addEMA400(datas, i)
                                    if (datas[i].ema400 > 0 && (datas[i].ema400 < parseFloat(datas[i][4]))) {
                                        var priceOpen = parseFloat(datas[i][1])
                                        for (let x = i - 1; x >= 0; x--) {
                                            if (parseFloat(datas[x][1]) <= priceOpen) priceOpen = parseFloat(datas[x][1])
                                            else break;
                                        }
                                        let pass = true
                                        for (let x = i + 1; x < datas.length - 1; x++) {
                                            if (parseFloat(datas[x][4]) < priceOpen) {
                                                pass = false
                                                break
                                            }
                                        }
                                        if (pass) $('#result').text($('#result').text() + `${s.symbol}, `)
                                        break
                                    }
                                }
                            }
                        } catch (e) { }
                    }
                } catch (e) { throw e }
            })
        })

    </script>



</body>

</html>
