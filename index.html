<html>

<head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>

<body>
    <div class="col-sm-12">
        <div class="panel panel-primary">
            <div class="panel-heading">Frame</div>
            <div class="panel-body" style="display: flex;">
                <select id="bucket" class="form-select" style="height: 50px; width: 100px; font-size: 24px;">
                    <option value="chien">chien</option>
                    <option value="thuy">thuy</option>
                </select>
                <button id="go" class="btn btn-info" style="width: 100px; height: 50px; margin-left: 20px;">Go</button>
            </div>
        </div>
        <div class="panel panel-primary">
            <div class="panel-heading">List</div>
            <div class="panel-body" id="result"></div>
        </div>
    </div>
    <script>
        const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        function addEMA400(data, index) {
            var K = 2 / (400 + 1)
            var item = data[index];
            if (data[index - 1].ema)
                var prevEma = data[index - 1].ema;
            else {
                var sum = 0;
                var list400 = []
                for (var y = 0; y < 400; y++) {
                    var i2 = data[index - y];
                    list400.push(i2[4])
                    sum += parseFloat(i2[4]);
                }
                var prevEma = Math.round(sum / 400 * 10000000) / 10000000;
            }
            data[index]['ema400'] = (prevEma * K) + (prevEma * (1 - K));
        }
        async function thuy() {
            alert('start thuy')
            var res = await $.get(`https://api.binance.com/api/v1/exchangeInfo`)
            var symbols = res.symbols.filter(s => s.quoteAsset == 'USDT' && s.status == "TRADING").reverse()
            $('#result').text('')
            const percentIncrea = (candel) => {
                const open = parseFloat(candel[1])
                const close = parseFloat(candel[4])
                if(close <= open) return 0;
                const high = parseFloat(candel[2])
                const low = parseFloat(candel[3])
                console.log((high - low)/low)
                return (high - low)/low
            }
            const nearLow = (candel, lowVal) => {
                const currVal = parseFloat(candel[4])
                const per = Math.abs(currVal - lowVal) / lowVal
                console.log(per)
                return per < 0.1
            }
            for (var s of symbols) {
                if (s.symbol != 'SOPHUSDT') continue
                try{
                var datas = await $.get(`https://www.binance.com/api/v3/uiKlines?limit=100&symbol=${s.symbol}&interval=1d`)
                const candle1 = datas[datas.length - 1]
                const candle2 = datas[datas.length - 2]
                const candle3 = datas[datas.length - 3]
                const candle4 = datas[datas.length - 4]
                const candle5 = datas[datas.length - 5]
                const candle6 = datas[datas.length - 6]
                if(percentIncrea(candle1) > 0.25 && nearLow(candle1, parseFloat(candle1[3]))) {
                    console.log('candle1')
                    $('#result').text($('#result').text() + `${s.symbol}, `)
                    continue
                }
                if(percentIncrea(candle2) > 0.25 && nearLow(candle1, parseFloat(candle2[3]))
                ) {
                    console.log('candle2')
                    $('#result').text($('#result').text() + `${s.symbol}, `)
                    continue
                }
                if(percentIncrea(candle3) > 0.25 && nearLow(candle1, parseFloat(candle3[3]))
                ) {
                    console.log('candle3')
                    $('#result').text($('#result').text() + `${s.symbol}, `)
                    continue
                }
                if(percentIncrea(candle4) > 0.25 && nearLow(candle1, parseFloat(candle4[3]))
                ) {
                    console.log('candle4')
                    $('#result').text($('#result').text() + `${s.symbol}, `)
                    continue
                }
                if(percentIncrea(candle5) > 0.25 && nearLow(candle1, parseFloat(candle5[3]))
                ) {
                    console.log('candle5')
                    $('#result').text($('#result').text() + `${s.symbol}, `)
                    continue
                }
                if(percentIncrea(candle6) > 0.25 && nearLow(candle1, parseFloat(candle6[3]))
                ) {
                    console.log('candle6')
                    $('#result').text($('#result').text() + `${s.symbol}, `)
                    continue
                }
                } catch(e){}
            }
        }
        $(document).ready(function () {
            $('#go').click(async function () {
                const bucket = $('#bucket').val()
                if(bucket == 'thuy') {
                    thuy()
                    return
                }
                alert('start chien')
                try {
                    var res = await $.get(`https://api.binance.com/api/v1/exchangeInfo`)
                    var symbols = res.symbols.filter(s => s.quoteAsset == 'USDT' && s.status == "TRADING").reverse()
                    $('#result').text('')
                    for (var s of symbols) {
                        try {
                            // if (s.symbol == 'ROBOUSDT') continue
                            var datas = await $.get(`https://www.binance.com/api/v3/uiKlines?limit=900&symbol=${s.symbol}&interval=1d`)
                            if (datas.length > 420 || datas.length < 100) continue;
                            if (datas.length > 205) {
                                datas = await $.get(`https://www.binance.com/api/v3/uiKlines?limit=10000&symbol=${s.symbol}&interval=12h`)
                                for (let i = datas.length - 1; i >= 200; i--) {
                                    addEMA400(datas, i)
                                    if (datas[i].ema400 > 0 && (datas[i].ema400 < parseFloat(datas[i][4]))) {
                                        var priceOpen = parseFloat(datas[i][1])
                                        for (let x = i - 1; x >= 0; x--) {
                                            if (parseFloat(datas[x][1]) <= priceOpen) priceOpen = parseFloat(datas[x][1])
                                            else break;
                                        }
                                        let pass = true
                                        for (let x = i + 1; x < datas.length - 1; x++) {
                                            if (parseFloat(datas[x][4]) < priceOpen) {
                                                pass = false
                                                break
                                            }
                                        }
                                        if (pass) $('#result').text($('#result').text() + `${s.symbol}, `)
                                        break
                                    }
                                }
                            }
                            if (datas.length > 105) {
                                datas = await $.get(`https://www.binance.com/api/v3/uiKlines?limit=10000&symbol=${s.symbol}&interval=6h`)
                                for (let i = datas.length - 1; i >= 200; i--) {
                                    addEMA400(datas, i)
                                    if (datas[i].ema400 > 0 && (datas[i].ema400 < parseFloat(datas[i][4]))) {
                                        var priceOpen = parseFloat(datas[i][1])
                                        for (let x = i - 1; x >= 0; x--) {
                                            if (parseFloat(datas[x][1]) <= priceOpen) priceOpen = parseFloat(datas[x][1])
                                            else break;
                                        }
                                        let pass = true
                                        for (let x = i + 1; x < datas.length - 1; x++) {
                                            if (parseFloat(datas[x][4]) < priceOpen) {
                                                pass = false
                                                break
                                            }
                                        }
                                        if (pass) $('#result').text($('#result').text() + `${s.symbol}, `)
                                        break
                                    }
                                }
                            }
                        } catch (e) { }
                    }
                    alert('done')
                } catch (e) { alert(e) }
            })
        })

    </script>



</body>

</html>
